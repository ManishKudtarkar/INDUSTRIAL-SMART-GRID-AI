# docker-compose.override.yml
# ─────────────────────────────────────────────────────────────────────────────
# REAL HARDWARE MODE
#
# Use this when you want to connect real USB sensors or Android phones
# instead of the simulated substations.
#
# Usage:
#   1. Start only backend + frontend (no simulated substations):
#        docker-compose -f docker-compose.yml -f docker-compose.override.yml up backend frontend
#
#   2. Then run real hardware clients on your host machine:
#        python substations/substation_client.py --id S1 --host localhost
#        python substations/substation_client.py --id S2 --host localhost --source adb
#        python substations/substation_client.py --id S3 --host localhost
#
# The host machine connects to port 9999 which is exposed by the backend container.
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  # Disable simulated substations when using real hardware
  substation-s1:
    profiles:
      - simulation

  substation-s2:
    profiles:
      - simulation

  substation-s3:
    profiles:
      - simulation
